<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolys</title>

    <link rel="icon" href="/assets/app-logo.png">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/assets/icons/phosphor.css">
    <link rel="stylesheet" href="styles/index.css">

    <style>
        /* Transparent overlay positioning */
        html, body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Inter', sans-serif;
        }

        #dynamic-island-container {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="dynamic-island-container">
      <div id="layout-drag-surface" aria-hidden="true"></div>
      <!-- Bulle d'activité (retour micro) : features/mic-monitor.js -->
      <button type="button" id="island-satellite" class="island-satellite" title="Retour micro : clic pour régler, deux clics droits pour couper" aria-label="Retour micro"><span class="satellite-bg"></span><i class="ph-fill ph-microphone satellite-icon"></i><i class="ph-bold ph-power satellite-confirm"></i><span class="satellite-bars"><span></span><span></span><span></span><span></span></span></button>
      <!-- Bulle du minuteur, à gauche de la pilule : features/system.js -->
      <button type="button" id="island-timer-satellite" class="island-satellite island-satellite-timer" title="Chrono : clic pour l’ouvrir" aria-label="Minuteur en cours"><span class="satellite-bg"></span><svg class="satellite-ring" viewBox="0 0 36 36" aria-hidden="true"><circle pathLength="100" cx="18" cy="18" r="16"></circle></svg><span class="satellite-timer-value">0</span></button>
      <!-- Halo de la pilule : une couche à part, qui respire à 24 i/s (features/glow-halo.js) -->
      <div id="island-halo" aria-hidden="true"></div>
      <div id="dynamic-island" class="island-idle">
        <div class="island-glass-backdrop"><div class="island-bg-layer"></div></div>
        <div class="island-content">
          <!-- Rendu par DynamicIsland.js -->
        </div>
      </div>
      <!-- Placement : visible seulement en mode déplacement (features/preferences.js) -->
      <div id="layout-edit-toolbar" role="toolbar" aria-label="Placement de l’Island">
        <div class="layout-edit-group">
          <button type="button" data-layout="smaller" title="Plus petite"><i class="ph-bold ph-minus"></i></button>
          <span class="layout-edit-scale" aria-live="polite">100 %</span>
          <button type="button" data-layout="bigger" title="Plus grande"><i class="ph-bold ph-plus"></i></button>
        </div>
        <button type="button" class="layout-edit-text-btn" data-layout="center" title="Recentrer en haut de l’écran"><i class="ph ph-align-center-horizontal"></i>Centrer</button>
        <button type="button" class="layout-edit-text-btn" data-layout="preview" aria-pressed="false" title="Voir l’Island ouverte à cet endroit (lecteur)"><i class="ph ph-arrows-out-simple"></i>Aperçu</button>
        <button type="button" class="layout-edit-text-btn is-primary" data-layout="done"><i class="ph-bold ph-check"></i>Terminer</button>
        <p class="layout-edit-hint">Glisser : déplacer · Flèches : affiner · Molette : taille · Aperçu : voir l’Island ouverte · Échap : terminer</p>
      </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
